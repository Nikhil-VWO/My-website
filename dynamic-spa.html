    (function () {

        /* ─────────────────────────────────────────────

        var root = document.getElementById('root');

        /* ─────────────────────────────────────────────
           HELPER: inject a <style> block via JS only
        ───────────────────────────────────────────── */
        function injectStyle(css) {
            var el = document.createElement('style');
            el.textContent = css;
            document.head.appendChild(el);
        }

        /* ─────────────────────────────────────────────
           HELPER: show an error screen and halt
        ───────────────────────────────────────────── */
        function showError(message, code) {
            injectStyle(
                'body{margin:0;font-family:system-ui,sans-serif;background:#0f172a;' +
                'display:flex;align-items:center;justify-content:center;height:100vh;}' +

                '#root .err-code{font-size:.75rem;color:#475569;font-family:monospace;}'

                '<div class="err-icon">&#x26D4;</div>' +

        ═══════════════════════════════════════════ */

        }

        /* ═══════════════════════════════════════════
           GUARD 2 — authentication check
        ═══════════════════════════════════════════ */
        function getToken() {
            // Check localStorage first
            var lsToken = null;
            try { lsToken = localStorage.getItem('sessionToken'); } catch (e) {}
            if (lsToken) return lsToken;

            // Fall back to cookies
            var match = document.cookie.match(/(?:^|;\s*)sessionToken=([^;]+)/);
            return match ? decodeURIComponent(match[1]) : null;
        }

        var token = getToken();

        if (!token) {

                '  <p style="font-size:.875rem;color:#94a3b8;margin:.5rem 0 0;">and refresh.</p>' +
                '</div>';
            throw new Error('UNAUTHORIZED: no session token');

                  desc: 'GA4, VWO, heatmaps and conversion tracking configured.', price: '$800', stock: '5 slots left' },
                { id: 6, name: 'A/B Testing Sprint', category: 'Testing',
                  desc: 'Two-week experiment cycle with statistical analysis.', price: '$1,800', stock: '2 slots left' }
            ],
            activity: [
                { color: 'green', text: 'Order #1042 — Web Design Package confirmed', time: '2 minutes ago' },
                { color: 'blue',  text: 'User <strong>Sarah K.</strong> signed up via referral link', time: '18 minutes ago' },
                { color: 'amber', text: 'A/B Testing Sprint inventory low — only 2 slots remaining', time: '1 hour ago' },
                { color: 'green', text: 'Monthly Maintenance plan renewed for <strong>TechCorp Ltd.</strong>', time: '3 hours ago' },
                { color: 'blue',  text: 'Performance Audit report delivered to client', time: 'Yesterday' }
            ]
        };

        /* ═══════════════════════════════════════════
           STEP 6 — toast helper
        ═══════════════════════════════════════════ */
        function showToast(msg) {
            var toast = document.getElementById('spa-toast');
            if (!toast) return;
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(function () { toast.classList.remove('show'); }, 2800);
        }

        /* ═══════════════════════════════════════════
           STEP 7 — renderApp (called after delay)
        ═══════════════════════════════════════════ */
        function renderApp(data) {
            var u = data.user;

            // Build product cards with RANDOM class names (unstable DOM simulation)
            var productCardsHTML = data.products.map(function (p) {
                var randomClass = 'product-' + Math.random().toString(36).slice(2);
                return (
                    '<div class="' + randomClass + '" data-role="product-card" data-id="' + p.id + '">' +
                    '  <span class="card-badge">' + p.category + '</span>' +
                    '  <p class="card-name">' + p.name + '</p>' +
                    '  <p class="card-desc">' + p.desc + '</p>' +
                    '  <span class="card-price">' + p.price + '</span>' +
                    '  <span class="card-stock">' + p.stock + '</span>' +
                    '  <button class="card-btn" type="button">Add to cart</button>' +
                    '</div>'
                );
            }).join('');

            // Build activity feed
            var activityHTML = data.activity.map(function (a) {
                return (
                    '<div class="activity-item">' +
                    '  <div class="activity-dot ' + a.color + '"></div>' +
                    '  <div>' +
                    '    <div class="activity-text">' + a.text + '</div>' +
                    '    <div class="activity-time">' + a.time + '</div>' +
                    '  </div>' +
                    '</div>'
                );
            }).join('');

            // Render full app shell
            root.innerHTML =
                // Topbar
                '<nav class="spa-topbar">' +
                '  <span class="brand">&#9670; Dashboard</span>' +
                '  <div class="user-info">' +
                '    <div class="user-avatar">' + u.initials + '</div>' +
                '    <span class="user-name">' + u.name + '</span>' +
                '    <button class="btn-logout" id="btn-logout" type="button">Log out</button>' +
                '  </div>' +
                '</nav>' +

                // Main content
                '<main class="spa-main">' +

                '  <div class="spa-welcome">' +
                '    <h1>Welcome back, ' + u.name + ' &#128075;</h1>' +
                '    <p>Logged in as <strong>' + u.email + '</strong> &middot; Role: ' + u.role + '</p>' +
                '  </div>' +

                '  <div class="spa-section-title">Products <span>' + data.products.length + ' items</span></div>' +
                '  <div class="spa-grid">' + productCardsHTML + '</div>' +

                '  <div class="spa-section-title">Recent Activity</div>' +
                '  <div class="spa-activity">' + activityHTML + '</div>' +

                // ── Background image banner ──
                '  <div class="spa-section-title" style="margin-top:2.5rem;">Featured Banner <span>background-image</span></div>' +
                '  <div class="spa-bg-banner">' +
                '    <img class="banner-bg" src="https://images.unsplash.com/photo-1551434678-e076c223a692?w=1200&auto=format&fit=crop" alt="Office team working" loading="lazy">' +
                '    <div class="banner-overlay"></div>' +
                '    <div class="banner-text">' +
                '      <h2>Build something extraordinary</h2>' +
                '      <p>Your team is ready &mdash; let&rsquo;s ship great products together.</p>' +
                '    </div>' +
                '  </div>' +

                // ── Team images ──
                '  <div class="spa-section-title">Our Team <span>images</span></div>' +
                '  <div class="spa-team-grid">' +
                    [
                        { img: 1,  name: 'Alice Chen',    role: 'Lead Designer'     },
                        { img: 3,  name: 'Marcus Webb',   role: 'Frontend Dev'      },
                        { img: 5,  name: 'Priya Nair',    role: 'QA Engineer'       },
                        { img: 7,  name: 'Tom Erikson',   role: 'Backend Dev'       },
                        { img: 9,  name: 'Sara Lopez',    role: 'Product Manager'   },
                        { img: 11, name: 'James Okafor',  role: 'DevOps Engineer'   },
                    ].map(function (m) {
                        return (
                            '<div class="spa-team-card">' +
                            '  <img src="https://i.pravatar.cc/144?img=' + m.img + '" alt="' + m.name + '" loading="lazy">' +
                            '  <div class="team-name">' + m.name + '</div>' +
                            '  <div class="team-role">' + m.role + '</div>' +
                            '</div>'
                        );
                    }).join('') +
                '  </div>' +

                // ── Embedded iframe ──
                '  <div class="spa-section-title">Feedback Form <span>iframe</span></div>' +
                '  <div class="spa-iframe-wrap">' +
                '    <iframe src="feedback.html" title="Feedback form" loading="lazy"></iframe>' +
                '  </div>' +

                // ── Open Shadow DOM widget (custom element, mounted by JS below) ──
                '  <div class="spa-section-title">Metrics Widget <span>open shadow DOM</span></div>' +
                '  <spa-shadow-widget id="shadow-widget"></spa-shadow-widget>' +

                '</main>' +

                // Toast container
                '<div id="spa-toast"></div>';

            // ── Event listeners (attached after DOM exists) ──

            // Logout button
            document.getElementById('btn-logout').addEventListener('click', function () {
                try { localStorage.removeItem('sessionToken'); } catch (e) {}
                // Also clear cookie
                document.cookie = 'sessionToken=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';
                window.location.reload();
            });

            // Add-to-cart buttons
            document.querySelectorAll('[data-role="product-card"] .card-btn').forEach(function (btn) {
                btn.addEventListener('click', function (e) {
                    var card = e.target.closest('[data-role="product-card"]');
                    var name = card ? card.querySelector('.card-name').textContent : 'Item';
                    showToast(name + ' added to cart');
                });
            });

            // ── Mount Open Shadow DOM widget ──
            mountShadowWidget();
        }

        /* ═══════════════════════════════════════════
           Open Shadow DOM — <spa-shadow-widget>
           Defines and mounts a custom element whose
           internals are encapsulated in an open shadow
           root (mode: 'open' — inspectable in DevTools).
        ═══════════════════════════════════════════ */
        function mountShadowWidget() {
            // Only define once (guard against hot-reload)
            if (!customElements.get('spa-shadow-widget')) {
                customElements.define('spa-shadow-widget', class extends HTMLElement {
                    connectedCallback() {
                        var shadow = this.attachShadow({ mode: 'open' });

                        var metrics = [
                            { label: 'Page Views',       value: '128,430', delta: '+12%',  up: true  },
                            { label: 'Unique Visitors',  value: '47,920',  delta: '+8%',   up: true  },
                            { label: 'Bounce Rate',      value: '34.2%',   delta: '-3%',   up: false },
                            { label: 'Avg. Session',     value: '3m 47s',  delta: '+0.5m', up: true  },
                            { label: 'Conversions',      value: '3,810',   delta: '+21%',  up: true  },
                            { label: 'Revenue',          value: '$94,200', delta: '+9%',   up: true  },
                        ];

                        var insights = [
                            { icon: '📈', title: 'Traffic up 12% this week', body: 'Organic search is driving the most growth. Blog posts published on Tuesday consistently outperform other days by 2.4×.' },
                            { icon: '🎯', title: 'Top converting page: /pricing', body: 'The pricing page has a 6.8% conversion rate this month — up from 4.1% after the layout change deployed on Feb 10.' },
                            { icon: '⚠️', title: 'Bounce rate spike on mobile', body: 'Mobile bounce rate increased to 51% between 9 PM–11 PM. Likely caused by a slow third-party script on the checkout page.' },
                        ];

                        var cardsHTML = metrics.map(function (m) {
                            return (
                                '<div class="metric-card">' +
                                '  <div class="metric-label">' + m.label + '</div>' +
                                '  <div class="metric-value">' + m.value + '</div>' +
                                '  <div class="metric-delta ' + (m.up ? 'up' : 'down') + '">' + m.delta + '</div>' +
                                '</div>'
                            );
                        }).join('');

                        var insightsHTML = insights.map(function (ins) {
                            return (
                                '<div class="insight-item">' +
                                '  <div class="insight-icon">' + ins.icon + '</div>' +
                                '  <div class="insight-body">' +
                                '    <div class="insight-title">' + ins.title + '</div>' +
                                '    <div class="insight-text">' + ins.body + '</div>' +
                                '  </div>' +
                                '</div>'
                            );
                        }).join('');

                        shadow.innerHTML =
                            '<style>' +
                            /* Host / wrapper */
                            ':host{display:block;background:#fff;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;}' +

                            /* Widget header */
                            '.widget-header{padding:1.25rem 1.5rem;border-bottom:1px solid #f1f5f9;}' +
                            '.widget-header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:.35rem;}' +
                            '.widget-title{font-size:1rem;font-weight:800;color:#1e293b;}' +
                            '.widget-badge{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;' +
                            'padding:.2rem .55rem;background:#ede9fe;color:#6d28d9;border-radius:99px;}' +
                            '.widget-desc{font-size:.825rem;color:#6b7280;line-height:1.55;}' +

                            /* Metrics grid */
                            '.section-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;' +
                            'color:#94a3b8;padding:1rem 1.5rem .6rem;}' +
                            '.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.875rem;padding:0 1.5rem 1.25rem;}' +
                            '.metric-card{background:#f8fafc;border-radius:12px;padding:1rem 1.1rem;transition:transform .18s;}' +
                            '.metric-card:hover{transform:translateY(-2px);}' +
                            '.metric-label{font-size:.72rem;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.4rem;}' +
                            '.metric-value{font-size:1.4rem;font-weight:800;color:#1e293b;margin-bottom:.3rem;}' +
                            '.metric-delta{font-size:.78rem;font-weight:700;padding:.15rem .5rem;border-radius:99px;display:inline-block;}' +
                            '.metric-delta.up{background:#dcfce7;color:#16a34a;}' +
                            '.metric-delta.down{background:#fee2e2;color:#dc2626;}' +

                            /* Summary paragraph */
                            '.summary{margin:0 1.5rem 1.25rem;padding:1rem 1.25rem;background:#f0f9ff;' +
                            'border-left:3px solid #38bdf8;border-radius:0 10px 10px 0;}' +
                            '.summary-title{font-size:.78rem;font-weight:700;color:#0284c7;margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.05em;}' +
                            '.summary-text{font-size:.85rem;color:#0369a1;line-height:1.65;}' +

                            /* Insights list */
                            '.insights{padding:0 1.5rem 1.25rem;display:flex;flex-direction:column;gap:.75rem;}' +
                            '.insight-item{display:flex;gap:.875rem;padding:.875rem 1rem;' +
                            'background:#fafafa;border:1px solid #f1f5f9;border-radius:12px;}' +
                            '.insight-icon{font-size:1.25rem;flex-shrink:0;margin-top:.05rem;}' +
                            '.insight-title{font-size:.85rem;font-weight:700;color:#1e293b;margin-bottom:.3rem;}' +
                            '.insight-text{font-size:.8rem;color:#6b7280;line-height:1.6;}' +

                            /* Footer note */
                            '.widget-footer{padding:.875rem 1.5rem;background:#f8fafc;' +
                            'border-top:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;}' +
                            '.footer-note{font-size:.75rem;color:#94a3b8;}' +
                            '.footer-note strong{color:#6b7280;}' +
                            '.footer-link{font-size:.75rem;font-weight:700;color:#6366f1;cursor:pointer;}' +
                            '.footer-link:hover{text-decoration:underline;}' +
                            '</style>' +

                            /* Widget header */
                            '<div class="widget-header">' +
                            '  <div class="widget-header-row">' +
                            '    <span class="widget-title">Analytics Overview</span>' +
                            '    <span class="widget-badge">Open Shadow DOM</span>' +
                            '  </div>' +
                            '  <p class="widget-desc">Live metrics and insights for the past 7 days. This entire widget — including its styles and text — lives inside an <strong>open shadow root</strong>. Outer page CSS cannot reach it.</p>' +
                            '</div>' +

                            /* Metrics */
                            '<div class="section-label">Key Metrics — Last 7 Days</div>' +
                            '<div class="grid">' + cardsHTML + '</div>' +

                            /* Summary */
                            '<div class="summary">' +
                            '  <div class="summary-title">Weekly Summary</div>' +
                            '  <p class="summary-text">Overall performance is trending positively. Revenue grew by 9% compared to last week, driven primarily by the new pricing page layout and an increase in organic search traffic. Conversion rate reached a monthly high of 6.8% on the /pricing route. Monitor the mobile bounce rate spike before the next deploy.</p>' +
                            '</div>' +

                            /* Insights */
                            '<div class="section-label">Automated Insights</div>' +
                            '<div class="insights">' + insightsHTML + '</div>' +

                            /* Footer */
                            '<div class="widget-footer">' +
                            '  <span class="footer-note">Last updated: <strong>Today, 10:42 AM</strong> &nbsp;·&nbsp; Data source: Analytics API v3</span>' +
                            '  <span class="footer-link">View full report →</span>' +
                            '</div>';

                        console.log('[dynamic-spa] Open shadow DOM widget mounted — shadow root mode:', shadow.mode);
                    }
                });
            }

            // If the element is already in the DOM (set via innerHTML above), its
            // connectedCallback fires automatically once defined. Nothing extra needed.
        }

        /* ═══════════════════════════════════════════
           STEP 8 — delayed render (2.5 s mock API)
        ═══════════════════════════════════════════ */
        setTimeout(function () {
            renderApp(mockData);
        }, 2500);

    })();
    </script>
</body>
</html>
