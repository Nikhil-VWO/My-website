<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Start VWO SmartCode --> 
<script src="https://dev.visualwebsiteoptimizer.com/cloud-run-test/final/6003651.js"></script> 
<!-- End VWO SmartCode -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <!-- No static styles. All CSS injected by JavaScript. -->
</head>
<body>
    <!-- Static shell: empty root div. All content rendered by JS. -->
    <!-- Editor OuterHTML capture will see only this empty div.   -->
    <div id="root"></div>

    <script>
    (function () {
        'use strict';

        console.log('[cart] Page loaded. Reading cart from localStorage...');

        /* ─────────────────────────────────────────────
           PRODUCT POOL — 6 items available to add
        ───────────────────────────────────────────── */
        var PRODUCTS = [
            { id: 'p1', name: 'Wireless Headphones', price: 79.99,  emoji: '🎧' },
            { id: 'p2', name: 'Mechanical Keyboard',  price: 129.00, emoji: '⌨️' },
            { id: 'p3', name: 'USB-C Hub',             price: 49.99,  emoji: '🔌' },
            { id: 'p4', name: 'Webcam HD 1080p',       price: 89.00,  emoji: '📷' },
            { id: 'p5', name: 'Desk LED Lamp',          price: 34.99,  emoji: '💡' },
            { id: 'p6', name: 'Laptop Stand',           price: 59.99,  emoji: '💻' },
        ];

        /* ─────────────────────────────────────────────
           LOCALSTORAGE HELPERS
        ───────────────────────────────────────────── */
        var CART_KEY = 'cart';

        function readCart() {
            try {
                var raw = localStorage.getItem(CART_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                console.warn('[cart] Failed to parse localStorage cart:', e);
                return [];
            }
        }

        function writeCart(items) {
            try {
                localStorage.setItem(CART_KEY, JSON.stringify(items));
                console.log('[cart] Cart saved to localStorage:', items.length, 'item(s)');
            } catch (e) {
                console.warn('[cart] Failed to write localStorage:', e);
            }
        }

        function addRandomItem() {
            var cart = readCart();
            var product = PRODUCTS[Math.floor(Math.random() * PRODUCTS.length)];
            var existing = null;
            for (var i = 0; i < cart.length; i++) {
                if (cart[i].id === product.id) { existing = cart[i]; break; }
            }
            if (existing) {
                existing.qty += 1;
                console.log('[cart] Incremented qty for:', product.name, '→', existing.qty);
            } else {
                cart.push({ id: product.id, name: product.name, price: product.price, emoji: product.emoji, qty: 1 });
                console.log('[cart] Added new item:', product.name);
            }
            writeCart(cart);
            render();
        }

        function updateQty(id, delta) {
            var cart = readCart();
            var item = null;
            for (var i = 0; i < cart.length; i++) {
                if (cart[i].id === id) { item = cart[i]; break; }
            }
            if (!item) return;
            item.qty = Math.max(0, item.qty + delta);
            if (item.qty === 0) {
                cart = cart.filter(function (c) { return c.id !== id; });
                console.log('[cart] Removed item:', id);
            } else {
                console.log('[cart] Updated qty for:', item.name, '→', item.qty);
            }
            writeCart(cart);
            render();
        }

        function removeItem(id) {
            var cart = readCart().filter(function (c) { return c.id !== id; });
            writeCart(cart);
            console.log('[cart] Removed item:', id);
            render();
        }

        /* ─────────────────────────────────────────────
           INJECT STYLES (all via JS — no static CSS)
        ───────────────────────────────────────────── */
        function injectStyles() {
            var s = document.createElement('style');
            s.textContent =
                '*{box-sizing:border-box;margin:0;padding:0;}' +
                'body{font-family:system-ui,-apple-system,sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh;}' +

                /* Topbar */
                '.cart-topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:1rem 2rem;' +
                'display:flex;align-items:center;justify-content:space-between;}' +
                '.cart-topbar h1{font-size:1.25rem;font-weight:800;color:#1e293b;}' +
                '.cart-badge{background:#6366f1;color:#fff;font-size:.75rem;font-weight:700;' +
                'padding:.2rem .55rem;border-radius:99px;margin-left:.5rem;}' +
                '.cart-back{font-size:.85rem;color:#6366f1;text-decoration:none;font-weight:600;}' +
                '.cart-back:hover{text-decoration:underline;}' +

                /* Layout */
                '.cart-wrapper{max-width:1100px;margin:2rem auto;padding:0 1.5rem;' +
                'display:grid;grid-template-columns:1fr 340px;gap:1.5rem;}' +

                /* Item list */
                '.cart-items-section h2{font-size:1rem;font-weight:700;color:#475569;' +
                'text-transform:uppercase;letter-spacing:.06em;margin-bottom:1rem;}' +
                '.cart-item-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;' +
                'padding:1.25rem;display:flex;align-items:center;gap:1rem;margin-bottom:.875rem;' +
                'transition:box-shadow .2s;}' +
                '.cart-item-card:hover{box-shadow:0 4px 16px rgba(99,102,241,.1);}' +
                '.cart-item-emoji{font-size:2.5rem;flex-shrink:0;width:56px;height:56px;' +
                'display:flex;align-items:center;justify-content:center;' +
                'background:#f8fafc;border-radius:12px;}' +
                '.cart-item-info{flex:1;}' +
                '.cart-item-name{font-size:.975rem;font-weight:700;color:#1e293b;margin-bottom:.2rem;}' +
                '.cart-item-price{font-size:.875rem;color:#6b7280;}' +
                '.cart-qty-controls{display:flex;align-items:center;gap:.5rem;}' +
                '.cart-qty-btn{width:28px;height:28px;border:1px solid #e2e8f0;border-radius:6px;' +
                'background:#fff;font-size:1rem;cursor:pointer;display:flex;align-items:center;' +
                'justify-content:center;transition:background .15s;}' +
                '.cart-qty-btn:hover{background:#f1f5f9;}' +
                '.cart-qty-value{font-size:.9rem;font-weight:700;min-width:24px;text-align:center;}' +
                '.cart-remove-btn{font-size:.75rem;color:#ef4444;background:none;border:none;' +
                'cursor:pointer;font-weight:600;padding:.25rem .5rem;border-radius:4px;}' +
                '.cart-remove-btn:hover{background:#fef2f2;}' +

                /* Empty state */
                '.cart-empty{background:#fff;border:1px solid #e2e8f0;border-radius:14px;' +
                'padding:3rem;text-align:center;margin-bottom:1rem;}' +
                '.cart-empty-icon{font-size:3rem;margin-bottom:1rem;}' +
                '.cart-empty h2{font-size:1.1rem;font-weight:700;color:#1e293b;margin-bottom:.4rem;}' +
                '.cart-empty p{font-size:.875rem;color:#6b7280;}' +

                /* Summary sidebar */
                '.cart-summary{background:#fff;border:1px solid #e2e8f0;border-radius:14px;' +
                'padding:1.5rem;height:fit-content;position:sticky;top:1rem;}' +
                '.cart-summary h2{font-size:1rem;font-weight:700;color:#1e293b;margin-bottom:1.25rem;}' +
                '.cart-summary-row{display:flex;justify-content:space-between;' +
                'font-size:.875rem;color:#6b7280;margin-bottom:.6rem;}' +
                '.cart-summary-row.total{font-size:1rem;font-weight:800;color:#1e293b;' +
                'border-top:1px solid #e2e8f0;padding-top:.75rem;margin-top:.75rem;}' +
                '.cart-checkout-btn{display:block;width:100%;margin-top:1.25rem;padding:.75rem;' +
                'background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;' +
                'border:none;border-radius:10px;font-size:.9rem;font-weight:700;cursor:pointer;' +
                'transition:opacity .2s;}' +
                '.cart-checkout-btn:hover{opacity:.88;}' +
                '.cart-add-btn{display:block;width:100%;margin-top:.75rem;padding:.65rem;' +
                'background:#fff;color:#6366f1;border:1.5px solid #6366f1;' +
                'border-radius:10px;font-size:.875rem;font-weight:700;cursor:pointer;' +
                'transition:background .15s;}' +
                '.cart-add-btn:hover{background:#eef2ff;}' +

                /* Seed hint box */
                '.cart-hint{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;' +
                'padding:.75rem 1rem;font-size:.78rem;color:#92400e;margin-top:1rem;line-height:1.6;}' +
                '.cart-hint code{font-family:monospace;background:#fef3c7;padding:.1rem .3rem;border-radius:3px;}' +

                /* Responsive */
                '@media(max-width:700px){' +
                '.cart-wrapper{grid-template-columns:1fr;}' +
                '.cart-topbar{padding:1rem;}' +
                '}';
            document.head.appendChild(s);
            console.log('[cart] Styles injected');
        }

        /* ─────────────────────────────────────────────
           RENDER
        ───────────────────────────────────────────── */
        function render() {
            var cart = readCart();
            var root = document.getElementById('root');
            console.log('[cart] Rendering cart with', cart.length, 'item(s)');

            var totalItems = cart.reduce(function (sum, c) { return sum + c.qty; }, 0);
            var subtotal   = cart.reduce(function (sum, c) { return sum + c.price * c.qty; }, 0);
            var shipping   = cart.length > 0 ? 4.99 : 0;
            var total      = subtotal + shipping;

            /* Item cards HTML */
            var itemsHTML = '';
            if (cart.length === 0) {
                itemsHTML =
                    '<div class="cart-empty">' +
                    '  <div class="cart-empty-icon">🛒</div>' +
                    '  <h2>Your cart is empty</h2>' +
                    '  <p>Add some items using the button below to get started.</p>' +
                    '</div>';
            } else {
                cart.forEach(function (item) {
                    itemsHTML +=
                        '<div class="cart-item-card" data-id="' + item.id + '">' +
                        '  <div class="cart-item-emoji">' + item.emoji + '</div>' +
                        '  <div class="cart-item-info">' +
                        '    <div class="cart-item-name">' + item.name + '</div>' +
                        '    <div class="cart-item-price">$' + item.price.toFixed(2) + ' each</div>' +
                        '  </div>' +
                        '  <div class="cart-qty-controls">' +
                        '    <button class="cart-qty-btn" data-action="dec" data-id="' + item.id + '">−</button>' +
                        '    <span class="cart-qty-value">' + item.qty + '</span>' +
                        '    <button class="cart-qty-btn" data-action="inc" data-id="' + item.id + '">+</button>' +
                        '    <button class="cart-remove-btn" data-action="remove" data-id="' + item.id + '">Remove</button>' +
                        '  </div>' +
                        '</div>';
                });
            }

            /* Summary sidebar */
            var summaryHTML =
                '<div class="cart-summary">' +
                '  <h2>Order Summary</h2>' +
                '  <div class="cart-summary-row"><span>Subtotal (' + totalItems + ' item' + (totalItems !== 1 ? 's' : '') + ')</span><span>$' + subtotal.toFixed(2) + '</span></div>' +
                '  <div class="cart-summary-row"><span>Shipping</span><span>' + (shipping > 0 ? '$' + shipping.toFixed(2) : 'Free') + '</span></div>' +
                '  <div class="cart-summary-row total"><span>Total</span><span>$' + total.toFixed(2) + '</span></div>' +
                '  <button class="cart-checkout-btn" id="btn-checkout">Proceed to Checkout</button>' +
                '  <button class="cart-add-btn" id="btn-add-random">+ Add Random Item</button>' +
                '  <div class="cart-hint">' +
                '    <strong>Dev tip:</strong> seed the cart via console:<br>' +
                '    <code>localStorage.removeItem(\'cart\')</code> then refresh to clear.' +
                '  </div>' +
                '</div>';

            /* Full page HTML */
            root.innerHTML =
                '<nav class="cart-topbar">' +
                '  <span><span style="font-weight:800;font-size:1.1rem;">🛒 Shopping Cart</span>' +
                (totalItems > 0 ? '<span class="cart-badge">' + totalItems + '</span>' : '') +
                '  </span>' +
                '  <a href="index.html" class="cart-back">← Back to site</a>' +
                '</nav>' +
                '<div class="cart-wrapper">' +
                '  <div class="cart-items-section">' +
                '    <h2>Items' + (cart.length > 0 ? ' (' + cart.length + ')' : '') + '</h2>' +
                     itemsHTML +
                '  </div>' +
                   summaryHTML +
                '</div>';

            /* Attach event listeners after DOM is rendered */
            document.getElementById('btn-add-random').addEventListener('click', addRandomItem);

            document.getElementById('btn-checkout').addEventListener('click', function () {
                if (cart.length === 0) {
                    alert('Your cart is empty! Add some items first.');
                } else {
                    alert('Checkout flow not implemented in this demo.\nTotal: $' + total.toFixed(2));
                }
            });

            /* Qty / remove buttons (event delegation) */
            document.querySelectorAll('[data-action]').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var id     = btn.getAttribute('data-id');
                    var action = btn.getAttribute('data-action');
                    if (action === 'inc')    updateQty(id, +1);
                    if (action === 'dec')    updateQty(id, -1);
                    if (action === 'remove') removeItem(id);
                });
            });
        }

        /* ─────────────────────────────────────────────
           BOOT
        ───────────────────────────────────────────── */
        injectStyles();
        console.log('[cart] Dev tip: localStorage.removeItem("cart") then refresh to reset.');
        render();

    })();
    </script>
</body>
</html>
