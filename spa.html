    <script>
    (function () {
        'use strict';

        console.log('[spa] Booting SPA. Initial hash:', window.location.hash || '(none)');

        /* ─────────────────────────────────────────────

        function injectStyles() {
            var s = document.createElement('style');
            s.textContent =
                '*{box-sizing:border-box;margin:0;padding:0;}' +
                'body{font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;color:#1e293b;min-height:100vh;}' +

                /* Shell */
                '#app{display:flex;flex-direction:column;min-height:100vh;}' +

                /* Header */

                'position:sticky;top:0;z-index:100;}' +

                'background:linear-gradient(135deg,rgba(99,102,241,.85),rgba(139,92,246,.75));z-index:0;}' +

                '.home-hero-content{position:relative;z-index:1;}' +
                '.home-hero-eyebrow{font-size:.75rem;font-weight:700;text-transform:uppercase;' +
                'letter-spacing:.1em;opacity:.7;margin-bottom:.6rem;}' +
                '.home-hero h1{font-size:2.25rem;font-weight:900;margin-bottom:.85rem;line-height:1.15;}' +
                '.home-hero p{font-size:1rem;opacity:.82;max-width:520px;line-height:1.65;margin-bottom:1.75rem;}' +
                '.home-hero-actions{display:flex;gap:.875rem;flex-wrap:wrap;}' +
                '.home-hero-btn-primary{display:inline-block;background:#fff;color:#6366f1;' +

            var recentOrdersHTML = MOCK_ORDERS.slice(0, 3).map(function (o) {
                return (
                    '<div class="profile-recent-order">' +
                    '  <span class="order-icon">' + o.items[0].emoji + '</span>' +
                    '  <div>' +
                    '    <div class="order-name">' + o.items[0].name + (o.items.length > 1 ? ' +' + (o.items.length - 1) + ' more' : '') + '</div>' +
                    '    <div class="order-date">' + o.date + ' &middot; ' + o.total + '</div>' +
                    '  </div>' +
                    '  ' + statusBadge(o.status) +
                    '</div>'
                );
            }).join('');

            var prefs = [
                { label: 'Order updates via email', on: true },
                { label: 'Promotional offers',      on: true },
                { label: 'SMS notifications',        on: false },
                { label: 'Newsletter',               on: true },
            ];

            return (
                '<span class="spa-route-badge">Route: #profile</span>' +

                /* Cover + header */
                '<div class="profile-cover"></div>' +
                '<div class="profile-header">' +
                '  <div class="profile-avatar-wrap">' +
                '    <div class="profile-avatar">' + u.initials + '</div>' +
                '    <div class="profile-badge">✓</div>' +
                '  </div>' +
                '  <div class="profile-name">' + u.name + '</div>' +
                '  <div class="profile-handle">' + u.handle + ' &nbsp;·&nbsp; ' + u.member + '</div>' +
                '  <div class="profile-actions">' +
                '    <button class="profile-btn-primary">Edit Profile</button>' +
                '    <button class="profile-btn-secondary">Share Profile</button>' +
                '    <button class="profile-btn-secondary">Download Invoice</button>' +
                '  </div>' +
                '</div>' +

                /* Two-column grid */
                '<div class="profile-grid">' +

                /* Stats */
                '  <div class="profile-section">' +
                '    <h3>Account Overview</h3>' +
                '    <div class="profile-stats-grid">' +
                '      <div class="profile-stat"><div class="profile-stat-value">' + u.orders + '</div><div class="profile-stat-label">Orders</div></div>' +
                '      <div class="profile-stat"><div class="profile-stat-value">' + u.wishlist + '</div><div class="profile-stat-label">Wishlist</div></div>' +
                '      <div class="profile-stat"><div class="profile-stat-value">' + u.reviews + '</div><div class="profile-stat-label">Reviews</div></div>' +
                '    </div>' +
                '    <div style="margin-top:1rem;background:#ede9fe;border-radius:10px;padding:.875rem;display:flex;align-items:center;justify-content:space-between;">' +
                '      <div><div style="font-size:.75rem;color:#6d28d9;font-weight:700;">Reward Points</div>' +
                '      <div style="font-size:1.3rem;font-weight:900;color:#6366f1;">' + u.points.toLocaleString() + ' pts</div></div>' +
                '      <button class="profile-btn-primary">Redeem</button>' +
                '    </div>' +
                '  </div>' +

                /* Account info */
                '  <div class="profile-section">' +
                '    <h3>Account Details</h3>' +
                '    <div class="profile-info-row"><span class="profile-info-label">Email</span><span class="profile-info-value">' + u.email + '</span></div>' +
                '    <div class="profile-info-row"><span class="profile-info-label">Phone</span><span class="profile-info-value">' + u.phone + '</span></div>' +
                '    <div class="profile-info-row"><span class="profile-info-label">Location</span><span class="profile-info-value">' + u.location + '</span></div>' +
                '    <div class="profile-info-row"><span class="profile-info-label">Member tier</span><span class="profile-info-value" style="color:#f59e0b;font-weight:800;">⭐ Gold</span></div>' +
                '  </div>' +

                /* Recent orders */
                '  <div class="profile-section">' +
                '    <h3>Recent Orders <a href="#orders" style="font-size:.75rem;color:#6366f1;font-weight:600;float:right;">View all →</a></h3>' +
                     recentOrdersHTML +
                '  </div>' +

                /* Notifications */
                '  <div class="profile-section">' +
                '    <h3>Notification Preferences</h3>' +
                     prefs.map(function (p) {
                         var id = 'toggle-' + Math.random().toString(36).slice(2);
                         return (
                             '<div class="pref-row">' +
                             '  <span class="pref-label">' + p.label + '</span>' +
                             '  <div class="toggle ' + (p.on ? 'on' : '') + '" id="' + id + '" data-on="' + p.on + '"></div>' +
                             '</div>'
                         );
                     }).join('') +
                '  </div>' +

                '</div>' // end profile-grid
            );
        }

        function renderOrders(activeTab) {
            activeTab = activeTab || 'all';
            console.log('[spa] Rendering #orders view (tab:', activeTab, ')');

            var tabs = ['all', 'delivered', 'shipped', 'processing'];
            var filtered = activeTab === 'all'
                ? MOCK_ORDERS
                : MOCK_ORDERS.filter(function (o) { return o.status === activeTab; });

            var trackLabels = ['Ordered', 'Confirmed', 'Dispatched', 'Delivered'];

            var ordersHTML = filtered.map(function (o) {
                var itemChips = o.items.map(function (i) {
                    return (
                        '<div class="order-item-chip">' +
                        '  <span class="order-item-emoji">' + i.emoji + '</span>' +
                        '  <span class="order-item-name">' + i.name + '</span>' +
                        '  <span class="order-item-qty">×' + i.qty + '</span>' +
                        '</div>'
                    );
                }).join('');

                var trackHTML = '';
                if (o.status === 'shipped' || o.status === 'delivered') {
                    var stepsHTML = trackLabels.map(function (label, idx) {
                        var done = idx < o.trackStep;
                        return (
                            '<div class="track-step">' +
                            '  <div class="track-step-wrap">' +
                            '    <div class="track-dot ' + (done ? 'done' : '') + '"></div>' +
                            '    <div class="track-label">' + label + '</div>' +
                            '  </div>' +
                            (idx < trackLabels.length - 1 ? '<div class="track-line ' + (idx < o.trackStep - 1 ? 'done' : '') + '"></div>' : '') +
                            '</div>'
                        );
                    }).join('');
                    trackHTML = '<div class="order-track"><div class="order-track-title">Tracking</div><div class="track-steps">' + stepsHTML + '</div></div>';
                }

                return (
                    '<div class="order-card">' +
                    '  <div class="order-card-header">' +
                    '    <div><div class="order-id">' + o.id + '</div><div class="order-date-text">' + o.date + '</div></div>' +
                    '    ' + statusBadge(o.status) +
                    '  </div>' +
                    '  <div class="order-items-row">' + itemChips + '</div>' +
                    '  <div class="order-card-footer">' +
                    '    <span class="order-total-text">Total: ' + o.total + '</span>' +
                    '    <div class="order-actions">' +
                    '      <button class="order-action-btn">View Details</button>' +
                    '      <button class="order-action-btn">Invoice</button>' +
                    (o.status === 'delivered' ? '<button class="order-action-btn primary">Reorder</button>' : '') +
                    '    </div>' +
                    '  </div>' +
                    trackHTML +
                    '</div>'
                );
            }).join('');

            var tabsHTML = tabs.map(function (t) {
                var labels = { all: 'All Orders', delivered: 'Delivered', shipped: 'Shipped', processing: 'Processing' };
                return '<button class="orders-tab' + (t === activeTab ? ' active' : '') + '" data-tab="' + t + '">' + labels[t] + '</button>';
            }).join('');

            return (
                '<span class="spa-route-badge">Route: #orders</span>' +
                '<div class="orders-toolbar">' +
                '  <span class="orders-title">My Orders</span>' +
                '  <div class="orders-filter-tabs" id="orders-tabs">' + tabsHTML + '</div>' +
                '</div>' +
                (filtered.length > 0 ? ordersHTML : '<div style="text-align:center;padding:3rem;color:#6b7280;">No orders found for this filter.</div>')
            );
        }

        function renderDeals() {
            console.log('[spa] Rendering #deals view');

            var dealsHTML = MOCK_DEALS.map(function (d) {
                return (
                    '<div class="deal-card">' +
                    '  <div class="deal-discount-ribbon">-' + d.discount + '</div>' +
                    '  <div class="deal-img">' + d.emoji + '</div>' +
                    '  <div class="deal-body">' +
                    '    <div class="deal-name">' + d.name + '</div>' +
                    '    <div class="deal-price-row">' +
                    '      <span class="deal-price">' + d.price + '</span>' +
                    '      <span class="deal-original">' + d.original + '</span>' +
                    '    </div>' +
                    '    <div class="deal-stock-bar-wrap">' +
                    '      <div class="deal-stock-label">' + d.stock + '% claimed</div>' +
                    '      <div class="deal-stock-track"><div class="deal-stock-fill" style="width:' + d.stock + '%"></div></div>' +
                    '    </div>' +
                    '    <button class="deal-add-btn" data-name="' + d.name + '">Grab Deal</button>' +
                    '  </div>' +
                    '</div>'
                );
            }).join('');

            return (
                '<span class="spa-route-badge">Route: #deals</span>' +
                '<div class="deals-banner">' +
                '  <div>' +
                '    <h2>⚡ Flash Sale — Ends soon!</h2>' +
                '    <p>Massive discounts on top products. Limited stock.</p>' +
                '  </div>' +
                '  <div class="deals-countdown" id="countdown-wrap">' +
                '    <div class="countdown-block"><span class="countdown-value" id="cd-h">00</span><span class="countdown-label">Hrs</span></div>' +
                '    <div class="countdown-block"><span class="countdown-value" id="cd-m">00</span><span class="countdown-label">Min</span></div>' +
                '    <div class="countdown-block"><span class="countdown-value" id="cd-s">00</span><span class="countdown-label">Sec</span></div>' +
                '  </div>' +
                '</div>' +
                '<div class="deals-grid">' + dealsHTML + '</div>'
            );
        }

        /* ─────────────────────────────────────────────
           ROUTER
        ───────────────────────────────────────────── */
        function getRoute() {
            var hash = window.location.hash;
            if (hash === '#products') return 'products';
            if (hash === '#profile')  return 'profile';
            if (hash === '#orders')   return 'orders';
            if (hash === '#deals')    return 'deals';
            return 'home';
        }

        var countdownTimer = null;

        function startCountdown() {
            // Countdown to next midnight
            function tick() {
                var now = new Date();
                var midnight = new Date(now);
                midnight.setHours(23, 59, 59, 999);
                var diff = midnight - now;
                var h = Math.floor(diff / 3600000);
                var m = Math.floor((diff % 3600000) / 60000);
                var sc = Math.floor((diff % 60000) / 1000);
                var hEl = document.getElementById('cd-h');
                var mEl = document.getElementById('cd-m');
                var sEl = document.getElementById('cd-s');
                if (hEl) hEl.textContent = String(h).padStart(2, '0');
                if (mEl) mEl.textContent = String(m).padStart(2, '0');
                if (sEl) sEl.textContent = String(sc).padStart(2, '0');
            }
            tick();
            countdownTimer = setInterval(tick, 1000);
        }

        function navigate() {
            var route = getRoute();
            console.log('[spa] Navigating to route:', route);

            if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }

            /* Update active nav link */
            document.querySelectorAll('.spa-nav-link').forEach(function (link) {
                var linkRoute = link.getAttribute('data-route');
                link.classList.toggle('active', linkRoute === route);
            });

            /* Swap content */
            var content = document.getElementById('spa-content');
            if (!content) return;

            if      (route === 'products') content.innerHTML = renderProducts();
            else if (route === 'profile')  content.innerHTML = renderProfile();
            else if (route === 'orders')   content.innerHTML = renderOrders();
            else if (route === 'deals')    { content.innerHTML = renderDeals(); startCountdown(); }
            else                           content.innerHTML = renderHome();

            /* Scroll to top of content */
            content.scrollIntoView({ behavior: 'smooth', block: 'start' });

            /* ── Post-render event listeners ── */

            /* Home hero buttons */
            var btnShop = document.getElementById('btn-hero-shop');
            if (btnShop) btnShop.addEventListener('click', function () { window.location.hash = '#products'; });
            var btnDeals = document.getElementById('btn-hero-deals');
            if (btnDeals) btnDeals.addEventListener('click', function () { window.location.hash = '#deals'; });

            /* Newsletter */
            var nlBtn = document.getElementById('nl-btn');
            if (nlBtn) nlBtn.addEventListener('click', function () {
                var v = (document.getElementById('nl-input') || {}).value;
                if (v && v.includes('@')) { nlBtn.textContent = '✓ Subscribed!'; nlBtn.style.background = '#10b981'; }
                else alert('Please enter a valid email address.');
            });

            /* Product "Add to Cart" */
            document.querySelectorAll('.product-add-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var name = btn.getAttribute('data-name') || 'Item';
                    btn.textContent = '✓ Added';
                    btn.style.background = '#10b981';
                    var cartCount = document.getElementById('header-cart-count');
                    if (cartCount) cartCount.textContent = parseInt(cartCount.textContent || 0) + 1;
                    setTimeout(function () { btn.textContent = 'Add to Cart'; btn.style.background = ''; }, 1500);
                });
            });

            /* Product filter buttons */
            var filtersBar = document.getElementById('filters-bar');
            if (filtersBar) filtersBar.addEventListener('click', function (e) {
                var btn = e.target.closest('[data-filter]');
                if (!btn) return;
                content.innerHTML = renderProducts(btn.getAttribute('data-filter'));
                window.dispatchEvent(new Event('spa-reattach'));
            });

            /* Orders tabs */
            var ordersTabs = document.getElementById('orders-tabs');
            if (ordersTabs) ordersTabs.addEventListener('click', function (e) {
                var btn = e.target.closest('[data-tab]');
                if (!btn) return;
                content.innerHTML = renderOrders(btn.getAttribute('data-tab'));
            });

            /* Profile toggles */
            document.querySelectorAll('.toggle').forEach(function (tog) {
                tog.addEventListener('click', function () {
                    var isOn = tog.classList.contains('on');
                    tog.classList.toggle('on', !isOn);
                    console.log('[spa] Toggle:', tog.id, '→', !isOn);
                });
            });

            /* Deals grab */
            document.querySelectorAll('.deal-add-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var name = btn.getAttribute('data-name') || 'Deal';
                    btn.textContent = '✓ Added to cart!';
                    btn.style.background = '#16a34a';
                    setTimeout(function () { btn.textContent = 'Grab Deal'; btn.style.background = ''; }, 2000);
                });
            });

            /* Re-attach after filter re-render */
            window.addEventListener('spa-reattach', function handler() {
                window.removeEventListener('spa-reattach', handler);
                document.querySelectorAll('.product-add-btn').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        btn.textContent = '✓ Added';
                        btn.style.background = '#10b981';
                        setTimeout(function () { btn.textContent = 'Add to Cart'; btn.style.background = ''; }, 1500);
                    });
                });
                var fb = document.getElementById('filters-bar');
                if (fb) fb.addEventListener('click', function (e) {
                    var b = e.target.closest('[data-filter]');
                    if (!b) return;
                    content.innerHTML = renderProducts(b.getAttribute('data-filter'));
                    window.dispatchEvent(new Event('spa-reattach'));
                });
            });
        }

        /* ─────────────────────────────────────────────
           RENDER SHELL (header + nav + content area)
        ───────────────────────────────────────────── */
        function renderShell() {
            var app = document.getElementById('app');
            app.innerHTML =
                '<header class="spa-header">' +
                '  <span class="spa-brand">&#9670; ShopSPA</span>' +
                '  <div class="spa-header-right">' +
                '    <a href="#orders" class="spa-nav-link" data-route="orders" style="border:none;padding:.25rem 0;">Orders</a>' +
                '    <span class="spa-header-cart" id="header-cart-icon">🛒 Cart' +
                '      <span class="spa-cart-count" id="header-cart-count">0</span>' +
                '    </span>' +
                '    <a href="index.html" class="spa-back">← Back to site</a>' +
                '  </div>' +
                '</header>' +
                '<nav class="spa-nav">' +
                '  <a href="#home"     class="spa-nav-link" data-route="home">Home</a>' +
                '  <a href="#products" class="spa-nav-link" data-route="products">Products</a>' +
                '  <a href="#deals"    class="spa-nav-link" data-route="deals">⚡ Deals <span class="nav-badge">Hot</span></a>' +
                '  <a href="#orders"   class="spa-nav-link" data-route="orders">My Orders</a>' +
                '  <a href="#profile"  class="spa-nav-link" data-route="profile">Profile</a>' +
                '</nav>' +
                '<div class="spa-content"><div id="spa-content"></div></div>';

            console.log('[spa] Shell rendered. Listening for hash changes.');
        }

        /* ─────────────────────────────────────────────
           BOOT
        ───────────────────────────────────────────── */
        injectStyles();
        renderShell();
        navigate();

        window.addEventListener('hashchange', function () {
            console.log('[spa] Hash changed to:', window.location.hash);
            navigate();
        });

    })();
    </script>
</body>
</html>
